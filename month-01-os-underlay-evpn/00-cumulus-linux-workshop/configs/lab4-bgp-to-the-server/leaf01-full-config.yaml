bridge:
  domain:
    br_default:
      vlan:
        10,20: {}
interface:
  bond0:
    bond:
      member:
        swp31-32: {}
    bridge:
      domain:
        br_default: {}
    type: bond
  eth0:
    ipv4:
      dhcp-client:
        set-hostname: enabled
        state: enabled
    type: eth
    vrf: mgmt
  lo:
    ipv4:
      address:
        10.255.255.1/32: {}
    type: loopback
  swp1,30:
    link:
      state:
        up: {}
    type: swp
  vlan10:
    ipv4:
      address:
        10.0.10.2/24: {}
      vrr:
        address:
          10.0.10.1/24: {}
        mac-address: 00:00:00:00:1a:10
    vlan: 10
  vlan10,20:
    ipv4:
      vrr:
        state: enabled
    type: svi
  vlan20:
    ipv4:
      address:
        10.0.20.2/24: {}
      vrr:
        address:
          10.0.20.1/24: {}
        mac-address: 00:00:00:00:2a:20
    vlan: 20
router:
  bgp:
    state: enabled
  vrr:
    state: enabled
system:
  aaa:
    class:
      nvapply:
        action: allow
        command-path:
          /:
            permission: all
      nvshow:
        action: allow
        command-path:
          /:
            permission: ro
      sudo:
        action: allow
        command-path:
          /:
            permission: all
    role:
      nvue-admin:
        class:
          nvapply: {}
      nvue-monitor:
        class:
          nvshow: {}
      system-admin:
        class:
          nvapply: {}
          sudo: {}
    user:
      cumulus:
        full-name: cumulus,,,
        hashed-password: '*'
        role: system-admin
  api:
    state: enabled
  config:
    auto-save:
      state: enabled
  control-plane:
    acl:
      acl-default-dos:
        inbound: {}
      acl-default-whitelist:
        inbound: {}
  docker:
    state: enabled
    vrf: mgmt
  hostname: leaf01
  ntp: {}
  ssh-server:
    state: enabled
  wjh:
    channel:
      forwarding:
        trigger:
          l2: {}
          l3: {}
          tunnel: {}
    state: enabled
vrf:
  default:
    router:
      bgp:
        state: enabled
        autonomous-system: 65101
        router-id: 10.255.255.1
        path-selection:
          multipath:
            aspath-ignore: enabled
        address-family:
          ipv4-unicast:
            state: enabled
            network:
              10.0.10.0/24: {}
              10.255.255.1/32: {}
        neighbor:
          swp1:
            remote-as: external
            type: unnumbered
          swp30:
            remote-as: external
            type: unnumbered