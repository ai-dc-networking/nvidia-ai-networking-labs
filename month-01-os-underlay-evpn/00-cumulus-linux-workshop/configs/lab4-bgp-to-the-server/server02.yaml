bridge:
  domain:
    br_default:
      vlan:
        5: {}
interface:
  eth0:
    ipv4:
      dhcp-client:
        set-hostname: enabled
        state: enabled
    type: eth
    vrf: mgmt
  lo:
    ipv4:
      address:
        192.168.20.1/32: {}
    type: loopback
  swp2:
    link:
      state:
        up: {}
    type: swp
  vlan5:
    ipv4:
      address:
        10.20.20.1/24: {}
    type: svi
    vlan: 5
router:
  bgp:
    state: enabled
system:
  hostname: server02
vrf:
  default:
    router:
      bgp:
        state: enabled
        autonomous-system: 65401
        router-id: 192.168.20.1
        address-family:
          ipv4-unicast:
            state: enabled
            network:
              10.20.20.0/24: {}
              192.168.20.1/32: {}
            redistribute:
              connected:
                state: enabled
              static:
                state: enabled
        neighbor:
          swp2:
            remote-as: external
            type: unnumbered
      static:
        10.20.20.0/24:
          address-family: ipv4-unicast
          via:
            lo:
              type: interface